# Build the plugin wheel and publish it with SHA256SUMS and mlaser-plugin-index.json on the
# GitHub release of the pushed tag (mlaser plugin standard, docs/dev/PLUGIN_STANDARD.md §6).
# The plugin manager reads the release as a repository: github:<owner>/<repo>.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write              # create the release and upload its assets

env:
  # the mlaser version whose index tool checks the wheel (a tag or branch of rahilm/fiber_laser)
  MLASER_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      # the index tool is part of mlaser (only the standard library and Qt-free modules):
      # installed without its GUI dependencies
      - name: Index and checksums (checked like the plugin manager checks them)
        run: |
          python -m pip install --no-deps "mlaser @ git+https://github.com/rahilm/fiber_laser@${MLASER_REF}"
          python -m mlaser.services.plugin_index build dist/*.whl -o dist/mlaser-plugin-index.json \
            --sha256sums dist/SHA256SUMS --name "${GITHUB_REPOSITORY}" \
            --homepage "https://github.com/${GITHUB_REPOSITORY}"
          python -m mlaser.services.plugin_index check dist/mlaser-plugin-index.json dist/*.whl
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS dist/mlaser-plugin-index.json --clobber
