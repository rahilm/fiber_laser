# mlaser-native: the optional C kernel of the emitter loop (docs/dev/NATIVE_KERNEL.md).
# A separate distribution so that mlaser itself installs and runs without a compiler; the
# "native-sampling" ParityProfile (mlaser/parity_ports/profiles/native.py) selects it.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlaser-native"
version = "0.1.0"
description = "Optional C kernel for mlaser's per-sample emitter loop (bit-identical to the Python port)"
license = "MIT"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
