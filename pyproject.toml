[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence metadata
build-backend = "setuptools.build_meta"

[project]
name = "mlaser"
version = "0.1.0"
description = "Cross-platform rebuild of the Gweike Mlaser fiber-laser cutting CAM/CNC software (reverse-engineered, untested on hardware)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.1",
    "numpy>=1.24",
    "shapely>=2.0",
    "segno>=1.6",        # Draw -> QR code
    "fontTools>=4.40",   # DXF TEXT / Draw text outlines (GGO_BEZIER-style records)
    "Pillow>=10",        # bitmap engraving (Bitmap.exe port)
]

[project.optional-dependencies]
devices = ["hidapi>=0.14", "pyserial>=3.5"]   # XHC pendant (HID), serial follower/laser links
plots = ["matplotlib>=3.7"]                     # HTML plots in tools/compare_capture.py
test = ["pytest>=7"]
all = ["mlaser[devices,plots,test]"]

[project.scripts]
mlaser = "mlaser.ui.__main__:main"
mlaser-cardsim = "mlaser.controller.simulator:main"

[tool.setuptools.packages.find]
include = ["mlaser*"]

[tool.setuptools.package-data]
"mlaser.ui" = ["resources/*.json", "resources/lang/*", "resources/icons/**/*"]
"mlaser.formats" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the Wine parity suite needs the external harness and its captures: run it with -m parity
addopts = "-m 'not parity'"
markers = [
    "unit: pure tests (no Qt widgets, no sockets); assigned by tests/conftest.py",
    "ui: builds Qt widgets (offscreen)",
    "sim: starts the UDP card simulator or a device simulator",
    "parity: compares with the original under Wine (tests/parity/, excluded by default)",
    "golden: frozen artefacts from tools/make_goldens.py (tests/golden/)",
    "safety: safety-behaviour tests (tests/safety/)",
]
