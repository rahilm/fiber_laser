[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence metadata
build-backend = "setuptools.build_meta"

[project]
name = "mlaser"
version = "0.1.0rc1"
description = "Cross-platform rebuild of the Gweike Mlaser fiber-laser cutting CAM/CNC software (reverse-engineered, untested on hardware)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",   # CI: ubuntu / 3.14 on every push; cp314 wheels
]
requires-python = ">=3.12"   # PySide6 6.12 crashes on 3.11 (none_dealloc); goldens pinned to 3.12
# Floors (review F7): the lowest versions a clean Python 3.12 environment was started and tested
# with (the app's --smoke-test, the half-screen, accessibility, integration, options and CAM
# tests).  Qt: only modules of PySide6-Essentials are imported (QtCore, QtGui, QtWidgets, QtSvg,
# QtPrintSupport, QtNetwork; QtDBus, QtTest in tests), so not the PySide6 meta-package (+Addons,
# WebEngine, Pdf: ~440 MB never imported); 6.9 lays the docks out differently
# (tests/test_half_screen.py), 6.10 passes.  numpy 1.26 / shapely 2.0.2: the first with
# CPython 3.12 wheels; the code uses no numpy 2 API, and with numpy 1.26.4 the goldens are
# bit-identical and the unit suite passes (2026-11-11).  platformdirs: the configuration, data and log folders (required at start).
dependencies = [
    "PySide6-Essentials>=6.10",
    "ezdxf>=1.1",
    "numpy>=1.26",
    "shapely>=2.0.2",
    "platformdirs>=4",
    "segno>=1.6",        # Draw -> QR code
    "fontTools>=4.40",   # DXF TEXT / Draw text outlines (GGO_BEZIER-style records)
    "Pillow>=10",        # bitmap engraving (Bitmap.exe port)
    "svgelements>=1.9.6",  # SVG import (MIT): <use>, CSS, transforms, shapes
    "pyclipper>=1.3",      # kerf fallback offset (MIT, Clipper1)
    "uharfbuzz>=0.40",     # text shaping for Draw -> Text and modern DXF TEXT (Apache-2.0)
]

[project.optional-dependencies]
devices = ["hidapi>=0.14", "pyserial>=3.5"]   # XHC pendant (HID), serial follower/laser links
plots = ["matplotlib>=3.7"]                     # HTML plots in tools/compare_capture.py
test = ["pytest>=7"]
# optional "modern" ParityProfile options (docs/dev/PERFORMANCE.md, docs/ASSETS.md)
ortools = ["ortools>=9.10"]   # sort mode 20 on OR-Tools routing (Apache-2.0, ~25 MB wheel)
nest = ["spyrrow>=0.9"]       # sparrow strip-packing nester (MIT; jagua-rs MPL-2.0 inside)
ruckig = ["ruckig>=0.14"]     # jerk-limited per-segment profiles, modern planner (MIT, Community)
modern = ["mlaser[ortools,nest,ruckig]"]
all = ["mlaser[devices,plots,test,modern]"]

[project.scripts]
mlaser = "mlaser.ui.__main__:main"
mlaser-cardsim = "mlaser.controller.simulator:main"
mlaser-cli = "mlaser.cli:main"         # the headless subcommands (also `mlaser <subcommand>`, docs/user/automation.md)

[tool.setuptools.packages.find]
include = ["mlaser*"]

[tool.setuptools.package-data]
"mlaser.ui" = ["resources/*.json", "resources/icons/tabler/*", "resources/icons/app/*"]
"mlaser.i18n" = ["*.json", "qm/*.qm"]   # catalogues; compiled Qt Linguist translations (docs/dev/i18n.md)
"mlaser.formats" = ["data/*"]
"mlaser.cad" = ["fontdata/*"]   # bundled Noto Sans SC / Arabic subsets + OFL (tools/build_bundled_fonts.py)
# the help documents (docs/user, dev, re): copied into the wheel as mlaser/help/docs by the build_py
# hook below (an editable install reads the checkout's docs/); mlaser.diag.helpdocs.docs_root
"mlaser" = ["help/docs/*.md", "help/docs/**/*"]

[tool.setuptools.exclude-package-data]
"mlaser._native" = ["*.c", "*.h"]   # the extension's source goes in the sdist only (MANIFEST.in)

[tool.setuptools.cmdclass]
build_py = "tools.help_build.BuildPy"
sdist = "tools.help_build.Sdist"   # writes mlaser/_build_info.py (the commit) into the sdist
# setup.py adds the optional C extension mlaser._native._emitter (compiler flags there)

[tool.uv]
# rebuild the editable install, and with it the C extension, when the build inputs change
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "mlaser/_native/*.c" }, { file = "mlaser/_native/*.h" }]

# ---------------------------------------------------------------------------- cibuildwheel
# Wheels with the C emitter kernel (.github/workflows/package.yml, job "wheels"): CPython 3.12 /
# 3.13 / 3.14 on Linux x86_64 + aarch64 (manylinux), Windows AMD64, macOS arm64 (Apple silicon only).  The kernel
# is required in a wheel (MLASER_BUILD_NATIVE=1); each wheel is installed in a clean
# environment and must select the kernel after its self-check (python -m mlaser._native).
# No 32-bit builds (x87 excess precision, docs/dev/NATIVE_KERNEL.md), no musllinux (no PySide6).
[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]   # not cp314t: no free-threaded PySide6 wheel
skip = ["*-musllinux_*", "*-manylinux_i686", "*-win32", "*-win_arm64"]
build-frontend = "build[uv]"
environment = { MLASER_BUILD_NATIVE = "1" }
# the kernel is active after its self-check, and its machine code holds no fused multiply-add
# (disassembled; tools/build_native.py --check --installed)
test-command = "python -m mlaser._native --require && python {project}/tools/build_native.py --check --installed"
# PySide6 6.12 has manylinux_2_34 (x86_64) / manylinux_2_39 (aarch64) wheels only: it cannot be
# installed inside the manylinux_2_28 build container, so the same test runs on the runner after
# the build (package.yml, "Test the wheels (Linux, on the runner)")
test-skip = "*-manylinux_*"

[tool.cibuildwheel.macos]
archs = ["arm64"]   # Apple silicon only; no Intel macOS build

[tool.pytest.ini_options]
testpaths = ["tests"]
# default run: no Wine parity suite (needs the external harness: -m parity) and no golden check
# (about 40 s: -m golden, or python tools/make_goldens.py --check)
addopts = "-m 'not parity and not golden'"
# old import paths left by the Wave 1 moves (mlaser/_compat.py) warn once; tests that still use
# them, and tests/test_compat_shims.py, must not fail or flood the summary
# the old ``extra`` keys of the typed model fields (mlaser.model.LegacyExtra) warn; the tests that
# exercise the old keys on purpose (compatibility) must not flood the summary
filterwarnings = ["ignore:mlaser\\..* moved to mlaser\\..*:DeprecationWarning",
                  "ignore::mlaser.model.LegacyExtraWarning"]
markers = [
    "unit: pure tests (no Qt widgets, no sockets); assigned by tests/conftest.py",
    "ui: builds Qt widgets (offscreen)",
    "sim: starts the UDP card simulator or a device simulator",
    "parity: compares with the original under Wine (tests/parity/, excluded by default)",
    "golden: frozen artefacts from tools/make_goldens.py (tests/golden/)",
    "safety: safety-behaviour tests (tests/safety/)",
    "timing: asserts a real-time bound in an otherwise untimed module: runs in a timing xdist group (tests/conftest.py)",
]

# ---------------------------------------------------------------------------- coverage
# Branch coverage of the mlaser package (docs/dev/TESTING.md, "Coverage"); measured in CI on the
# ubuntu / Python 3.12 job only (the tracer slows the run), report in the job summary and as the
# "coverage" artifact; no failing threshold yet.  Locally:
#   uv run pytest --cov --cov-report=term-missing:skip-covered -n 4 --dist loadgroup tests/safety
# pytest-cov combines the xdist workers.  The streamer and the plan process are multiprocessing
# *spawn* children and some tests start `python -m mlaser ...` with subprocess: "multiprocessing"
# and patch = ["subprocess"] start coverage in those children too, sigterm / _exit save the data
# of a child that is terminated or leaves through os._exit.  Code run on a QThread is not traced
# by the 3.12 tracer (the controller's threads are Python threads and are).
[tool.coverage.run]
source = ["mlaser"]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess", "_exit"]
sigterm = true
omit = ["mlaser/parity/*"]   # the Wine parity harness: needs the external original (-m parity)

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest>=7",
    "pre-commit>=3.5",
    "ruff>=0.6",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "hypothesis>=6.100",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8",      # CI: -n auto --dist loadgroup (docs/dev/TESTING.md)
    "coverage[toml]>=7.10",   # [tool.coverage.*] below; patch = ["subprocess"] needs 7.10
    "pytest-cov>=7",          # CI: one job (ubuntu / 3.12) measures; docs/dev/TESTING.md, "Coverage"
]
# PyInstaller one-folder builds (packaging/, CI job "package"); GPL with the bootloader exception,
# a build tool only, never shipped as a library
packaging = [
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/data", "tests/golden/*.json"]

[tool.ruff.lint]
# pyflakes and the syntax-level pycodestyle checks; the existing code puts short statements on one
# line (E702), assigns lambdas (E731) and uses l/I/O names from the original's variable names (E741)
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "E741"]

# ---------------------------------------------------------------------------- mypy
# Typed core, checked in CI: `mypy` (files below).  The other packages are not checked yet
# (follow_imports = "silent": their errors are not reported); add them here as they are cleaned
# up (ROADMAP Wave 2, "mypy on the rest").  Remaining `# type: ignore[code]` comments in the core
# are the baseline to burn down: each is an annotation gap, not a runtime change.
[tool.mypy]
python_version = "3.12"
files = ["mlaser/protocol", "mlaser/geom", "mlaser/parity_ports", "mlaser/_native", "mlaser/nc", "mlaser/services",
         "mlaser/ops", "mlaser/project", "mlaser/web", "mlaser/report/ledger.py",
         "mlaser/cli", "mlaser/api", "mlaser/notify", "mlaser/labels",
         "mlaser/ui/plugin_manager.py",   # the Plugin manager dialog (Review 2)
         "mlaser/ui/extension_context.py"]   # the built-in extensions' typed context (A12)
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# ---------------------------------------------------------------------------- import-linter
# Layering rules of docs/dev/ARCHITECTURE.md (architecture.md §6), checked in CI with
# `lint-imports`.  Every ignore below is an edge that could not be removed mechanically in Wave 1;
# each has a docs/ROADMAP.md item.  Lazy (function-level) imports count like top-level ones.
[tool.importlinter]
root_packages = ["mlaser"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point downward only"
type = "layers"
layers = [
    "mlaser.ui | mlaser.parity",
    "mlaser.cli",                 # the GUI launcher hands subcommands to it (mlaser.ui.__main__)
    "mlaser.services",
    "mlaser.api",                 # reuses the LAN monitor's hardened server (mlaser.web)
    "mlaser.diag | mlaser.report | mlaser.engrave | mlaser.web | mlaser.notify | mlaser.labels",
    "mlaser.controller",
    "mlaser.devices | mlaser.machine",
    "mlaser.ops",
    "mlaser.nc | mlaser.project",
    "mlaser.io | mlaser.nest",
    "mlaser.cam",
    "mlaser.motion",
    "mlaser.formats | mlaser.cad",
    "mlaser.parity_ports",
    "mlaser.geom | mlaser.protocol | mlaser.toolpath | mlaser.i18n",
    "mlaser.model",
]
# no ignores left: the layer defaults are injected (ConfigService.layer_defaults, Wave 3)

[[tool.importlinter.contracts]]
name = "Domain packages import no Qt"
type = "forbidden"
source_modules = [
    "mlaser.model", "mlaser.geom", "mlaser.protocol", "mlaser.toolpath", "mlaser.i18n",
    "mlaser.parity_ports",
    "mlaser.formats", "mlaser.cad", "mlaser.motion", "mlaser.cam", "mlaser.io", "mlaser.nest",
    "mlaser.nc", "mlaser.ops", "mlaser.machine", "mlaser.devices", "mlaser.controller",
    "mlaser.services", "mlaser.project", "mlaser.web",
    "mlaser.cli", "mlaser.api", "mlaser.notify", "mlaser.labels",
    "mlaser.ui.run_rules",            # the run controls' rules (review arch A15)
]
forbidden_modules = ["PySide6", "shiboken6"]
# no ignores left: cad / io text without Qt (Wave 2 performance track), the UI adapter's Qt
# bridge moved out of the controller (Wave 2 safety track)

[[tool.importlinter.contracts]]
name = "parity_ports imports only geom, protocol and model"
type = "forbidden"
source_modules = ["mlaser.parity_ports"]
forbidden_modules = [
    "mlaser.toolpath", "mlaser.i18n", "mlaser.formats", "mlaser.cad", "mlaser.motion",
    "mlaser.cam", "mlaser.io", "mlaser.nest", "mlaser.nc", "mlaser.machine", "mlaser.devices",
    "mlaser.controller", "mlaser.diag", "mlaser.report", "mlaser.engrave", "mlaser.ui",
    "mlaser.parity", "mlaser._compat",
]
# no ignores left: LayerView's defaults are injected (parity_ports.mainapp.layer.set_layer_defaults)

[[tool.importlinter.contracts]]
# the plugin manager's untrusted-input code (indexes, manifests, version specifiers) and the
# plugins' HTTP client hold no route to the machine (docs/dev/PLUGIN_STANDARD.md §5); the
# manager itself reaches the controller only through services.plugins (the plugin view)
name = "Plugin HTTP and manifest parsing cannot reach the machine"
type = "forbidden"
source_modules = ["mlaser.services.plugin_http", "mlaser.services.plugin_manifest", "mlaser.services.pep440"]
forbidden_modules = ["mlaser.controller", "mlaser.devices", "mlaser.protocol", "mlaser.nc.stream",
                     "mlaser.machine", "mlaser.ui", "PySide6"]

[[tool.importlinter.contracts]]
# the automation API and the notifications hold no route to the machine: no controller, no card
# protocol, no devices, no streamer (docs/dev/API.md "No remote motion"; tests/safety/test_automation_api.py)
name = "Automation API and notifications cannot reach the machine"
type = "forbidden"
source_modules = ["mlaser.api", "mlaser.notify"]
forbidden_modules = ["mlaser.controller", "mlaser.devices", "mlaser.protocol", "mlaser.nc.stream",
                     "mlaser.machine.api", "mlaser.machine.safety"]
