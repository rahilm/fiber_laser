name: Package

# PyInstaller one-folder builds (packaging/README.md): build, sign when the secrets exist,
# smoke-test the frozen app offscreen, upload the archive.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "mlaser/__main__.py"
      - "mlaser/netcheck.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported runner: the bundle runs on that glibc or newer
        os: [ubuntu-22.04, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      MLASER_NO_FIRSTRUN: "1"
      # "true"/"false": whether the signing secrets are configured (secrets are not allowed in `if:`)
      HAVE_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      HAVE_MAC_SIGNING: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libcups2 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # all extras: the optional modern options (OR-Tools ~70 MB unpacked, spyrrow, Ruckig) and the
      # device libraries are bundled; `python packaging/build.py --slim` leaves the modern ones out
      - name: Install (locked)
        run: uv sync --locked --group packaging --all-extras

      - name: Build (PyInstaller onedir)
        run: uv run --locked python packaging/build.py

      - name: Sign (Windows, Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAVE_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: ./packaging/sign_windows.ps1 -Bundle packaging/build/dist/mlaser

      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.HAVE_MAC_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: ./packaging/sign_macos.sh packaging/build/dist/mlaser.app

      # frozen app: bundle check (imports + package data + a DXF import), the GUI with --demo for
      # 5 s offscreen, and the network self-test (informative); then pack the archive
      - name: Smoke test and archive
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python packaging/build.py --skip-build --smoke --archive

      - uses: actions/upload-artifact@v4
        with:
          name: mlaser-${{ runner.os }}
          path: |
            packaging/build/mlaser-*.zip
            packaging/build/mlaser-*.tar.gz
            packaging/build/build-info.json
          if-no-files-found: error
          retention-days: 14
