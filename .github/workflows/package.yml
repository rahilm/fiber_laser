name: Package

# Wheels with the C emitter kernel (cibuildwheel), the sdist, and the PyInstaller one-folder
# bundles (packaging/README.md): build, sign when the secrets exist, smoke-test the frozen app
# offscreen, upload everything as artifacts. docs/dev/RELEASE.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "mlaser/__main__.py"
      - "mlaser/netcheck.py"
      - "mlaser/_native/**"
      - "mlaser/parity_ports/profiles/native.py"
      - "setup.py"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # one runner per architecture, so every wheel is tested natively. macOS: Apple silicon
        # only (arm64, [tool.cibuildwheel.macos]); no Intel macOS build.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # configuration: [tool.cibuildwheel] in pyproject.toml (cp312 / cp313, kernel required,
      # each wheel installed in a clean environment and `python -m mlaser._native --require`)
      - uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: wheelhouse
      # Linux: the wheels are built in the manylinux_2_28 container (the kernel needs only
      # glibc 2.17), but PySide6 6.12 ships manylinux_2_34 x86_64 / manylinux_2_39 aarch64
      # wheels only, so they cannot be installed in that container (cibuildwheel's own test is
      # skipped on Linux, [tool.cibuildwheel.linux]).  The same test runs here on the runner
      # (Ubuntu 24.04, glibc 2.39): each wheel with its dependencies in a clean venv.
      - name: Test the wheels (Linux, on the runner)
        if: runner.os == 'Linux'
        env:
          MLASER_NO_FIRSTRUN: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for whl in "$GITHUB_WORKSPACE"/wheelhouse/*.whl; do
            tag=$(basename "$whl" | cut -d- -f3)            # cp312 / cp313
            py="3.${tag#cp3}"
            echo "::group::$(basename "$whl") on Python $py"
            rm -rf venv
            uv venv -q --python "$py" venv
            uv pip install -q --python venv/bin/python "$whl"
            venv/bin/python -m mlaser._native --require
            venv/bin/python "$GITHUB_WORKSPACE/tools/build_native.py" --check --installed
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: uv build --sdist -o dist
      # without a C compiler the sdist still installs: the extension is optional (setup.py) and
      # the default profile then runs the Python port
      - name: Install the sdist without a C compiler (pure-Python fallback)
        env:
          CC: /bin/false
          MLASER_NO_FIRSTRUN: "1"
        run: |
          uv venv /tmp/nocc
          uv pip install --python /tmp/nocc dist/mlaser-*.tar.gz
          cd /tmp
          /tmp/nocc/bin/python -m mlaser._native --json
          /tmp/nocc/bin/python -m mlaser._native | grep "Python port"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest GitHub runner (22.04, glibc 2.35; 20.04 was retired in 2025): the
        # few X11 helper libraries the bundle takes from the host come from the oldest release
        os: [ubuntu-22.04, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      MLASER_NO_FIRSTRUN: "1"
      MLASER_BUILD_NATIVE: "1"         # the bundle ships the C kernel: a compile error fails
      # "true"/"false": whether the signing secrets are configured (secrets are not allowed in `if:`)
      HAVE_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      HAVE_MAC_SIGNING: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libcups2 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py

      # all extras: the optional modern options (OR-Tools ~70 MB unpacked, spyrrow, Ruckig) and the
      # device libraries are bundled; `python packaging/build.py --slim` leaves the modern ones out
      - name: Install (locked, builds the C kernel)
        run: uv sync --locked --group packaging --all-extras

      - name: C kernel check
        env:
          MLASER_NATIVE: "1"
        run: uv run --locked python tools/build_native.py --check

      # Linux: the bundle takes no system libraries from this host except the X11 helpers
      # (bundle_config.HOST_LIB_KEEP), and no bundled file may need a newer glibc than the
      # documented floor 2.34 (PySide6's manylinux_2_34; docs/dev/RELEASE.md)
      - name: Build (PyInstaller onedir)
        run: uv run --locked python packaging/build.py ${{ runner.os == 'Linux' && '--glibc-floor 2.34' || '' }}

      - name: Sign (Windows, Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAVE_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: ./packaging/sign_windows.ps1 -Bundle packaging/build/dist/mlaser

      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.HAVE_MAC_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: ./packaging/sign_macos.sh packaging/build/dist/mlaser.app

      # frozen app, MLASER_NATIVE=1: bundle check (imports + package data + the C kernel's
      # self-check + every optional backend the bundle ships, run on a small problem: OR-Tools,
      # spyrrow, Ruckig, the fonts, svgelements + a DXF import), the GUI with --demo for 5 s
      # offscreen, and the self-test (kernel line + network, informative); then pack the
      # archive.  Sizes, symbol floor and the smoke output go to the job summary.
      - name: Smoke test and archive
        shell: bash                    # also on Windows ($GITHUB_STEP_SUMMARY)
        env:
          QT_QPA_PLATFORM: offscreen
          MLASER_NATIVE: "1"
        run: uv run --locked python packaging/build.py --skip-build --smoke --archive --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mlaser-${{ runner.os }}
          path: |
            packaging/build/mlaser-*.zip
            packaging/build/mlaser-*.tar.gz
            packaging/build/build-info.json
          if-no-files-found: error
          retention-days: 14
