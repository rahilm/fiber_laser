name: CI

# No `paths-ignore` on the triggers: a skipped workflow leaves a required check pending forever
# (the checks a branch rule should require are listed in docs/dev/RELEASE.md, "Branch
# protection"), and a matrix job skipped by a job-level `if` reports one check with the
# unexpanded name instead of "ubuntu-latest / Python 3.12" ... .  A push or pull request that
# changes only documentation (Markdown files in docs/ or elsewhere that no test reads by path)
# is found by the job "changed files" instead: the test matrix then runs with every step skipped (each check is
# reported, green, under its usual name, in seconds), while the "import contracts, types, i18n,
# docs" job runs in full and checks the documents.
on:
  push:
  pull_request:
  workflow_dispatch:
  # nightly: the 3.13 column on Windows and macOS too (pushes run 3.13 on ubuntu only, F9 of the
  # 2026-11-09 review: its results track 3.12)
  schedule:
    - cron: "41 2 * * *"

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # "false": documentation only, the test matrix skips its steps; anything else runs them
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tests
      - name: Documentation only?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # everything runs unless every changed file is a Markdown document (docs/**/*.md, *.md)
        # whose path no test quotes ("docs/user/settings.md": a test reads it); the other files
        # under docs/ (the plugin template, the index schema) are tested like code.  A new branch,
        # a nightly or manual run, an unknown base or an API error run everything
        # (tests/test_ci_docs_only.py runs this script with a stand-in `gh`)
        shell: bash
        run: |
          set -uo pipefail
          code=true
          if { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && [ -n "${BASE//0/}" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD_SHA" --jq '.files[].filename') \
                && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  *.md)
                    if grep -rqF -e "\"$f\"" -e "'$f'" tests/; then
                      echo "$f: a test reads it"; code=true
                    fi ;;
                  *) echo "$f: not a Markdown document"; code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Documentation only: the test matrix skips its steps; the docs job checks the documents." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: changes
    # also when "changed files" failed: its output is then empty and every step runs
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # the coverage job runs under the tracer (about 1.5x slower)
    timeout-minutes: ${{ matrix.coverage && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 (the goldens' reference) on every OS; 3.13 on every OS only nightly
        python: ${{ fromJSON(github.event_name == 'schedule' && '["3.12", "3.13"]' || '["3.12"]') }}
        include:
          # branch coverage of mlaser on this one job ([tool.coverage.*] in pyproject.toml)
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
          - os: ubuntu-latest
            python: "3.13"
          # the newest CPython: PySide6 6.12 (abi3), numpy, shapely, OR-Tools, spyrrow, Ruckig
          # all have 3.14 wheels in uv.lock
          - os: ubuntu-latest
            python: "3.14"
    env:
      # "false" only for a documentation-only change ("changed files" above): every step below
      # is then skipped and the check passes under its usual name
      RUN_TESTS: ${{ needs.changes.outputs.code != 'false' }}
      QT_QPA_PLATFORM: offscreen       # headless Qt everywhere
      MLASER_PARITY: "0"               # no Wine parity harness in CI (tests/parity also deselected)
      MLASER_NO_FIRSTRUN: "1"
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      # the C emitter kernel (setup.py): a compile error fails the install instead of silently
      # leaving the Python port; and the default profile must select it (docs/dev/NATIVE_KERNEL.md)
      MLASER_BUILD_NATIVE: "1"
      MLASER_NATIVE: "1"
    steps:
      - name: Documentation only, tests skipped
        if: env.RUN_TESTS != 'true'
        run: echo "Only documentation changed (job 'changed files'); the docs job checks it."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN_TESTS == 'true'

      - name: Qt runtime libraries (Linux)
        if: env.RUN_TESTS == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: env.RUN_TESTS == 'true'
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py

      # all extras: the optional modern options (OR-Tools, spyrrow, Ruckig) are tested too.
      # The editable install compiles mlaser._native._emitter (gcc / clang / MSVC, setup.py flags).
      - name: Install (locked, builds the C kernel)
        if: env.RUN_TESTS == 'true'
        run: uv sync --locked --all-extras

      # the module imports, has no FMA instruction (objdump / llvm-objdump; skipped on Windows
      # without dumpbin), passes its self-check, is selected by default, smoke parity run
      - name: C kernel check
        if: env.RUN_TESTS == 'true'
        run: uv run --locked python tools/build_native.py --check

      - name: Desktop time slices (Windows, experiment)
        if: env.RUN_TESTS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          "Win32PrioritySeparation (registry): $((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl').Win32PrioritySeparation)"
          uv run --locked --no-sync python tools/ci_sched_probe.py
          uv run --locked --no-sync python tools/ci_sched_probe.py --desktop-quanta
          if ($LASTEXITCODE -ne 0) {
            $py = (uv run --locked --no-sync python -c "import sys; print(sys.executable)")
            $env:MLASER_QUANTA_LOG = "$env:RUNNER_TEMP\quanta.log"
            [Environment]::SetEnvironmentVariable("MLASER_QUANTA_LOG", $env:MLASER_QUANTA_LOG, "Machine")
            schtasks /create /tn mlaser-quanta /ru SYSTEM /sc onstart /f /tr "`"$py`" `"$PWD\tools\ci_sched_probe.py`" --desktop-quanta"
            schtasks /run /tn mlaser-quanta
            Start-Sleep 8
            schtasks /query /tn mlaser-quanta /v /fo list | Select-String "Last Result|Status|Task To Run"
            if (Test-Path $env:MLASER_QUANTA_LOG) { "as SYSTEM: $(Get-Content $env:MLASER_QUANTA_LOG)" } else { "as SYSTEM: no log" }
          }
          uv run --locked --no-sync python tools/ci_sched_probe.py
          exit 0

      - name: "Tests (default suite: unit, ui, sim, safety; parity and golden deselected; C kernel default)"
        if: env.RUN_TESTS == 'true'
        # pytest-xdist: one worker per CPU; tests/conftest.py puts every safety and sim test in
        # the xdist group "timing", so --dist loadgroup runs them one after another on one
        # worker (their real-time bounds keep their meaning) while the rest spreads over the
        # others (docs/dev/TESTING.md, "Parallel runs").  Every marker of the default run is
        # still collected: unit, ui, sim and safety.
        # macOS: -v names the running test, and a native crash leaves its Python stacks
        # (fault.log.gwN, one per worker) and the last command of the command-coverage test in
        # files shown by the next step (how the QMessageBox / checkbox crash of 2026-10-19 was
        # found, together with lldb)
        env:
          MLASER_FAULT_LOG: ${{ runner.temp }}/fault.log
          MLASER_COVERAGE_TRACE: ${{ runner.temp }}/coverage.log
        # faulthandler_timeout: a test running over 10 min dumps every thread's stack (a hang
        # shows where it hangs instead of the job's 40 min cancellation)
        # coverage job: --cov measures mlaser in every xdist worker and in the spawned children
        # (pyproject.toml [tool.coverage.run]); the report is the next steps' work
        run: uv run --locked pytest -n auto --dist loadgroup ${{ runner.os == 'macOS' && '-v' || '-q' }} --durations=15 -o faulthandler_timeout=600 ${{ matrix.coverage && '--cov --cov-report=' || '' }}

      # branch coverage, no threshold yet (F5 of the 2026-11-09 review): the safety-critical
      # modules as a table in the job summary, the whole package as the "coverage" artifact
      # (htmlcov/index.html, coverage.xml)
      - name: Coverage report
        if: env.RUN_TESTS == 'true' && (matrix.coverage && !cancelled())
        shell: bash
        run: |
          set -euo pipefail
          # a spawned child that saved its data after pytest-cov combined (a late streamer exit)
          shopt -s nullglob
          late=(.coverage.*)
          if [ ${#late[@]} -gt 0 ]; then uv run --locked --no-sync coverage combine --append -q; fi
          [ -f .coverage ] || { echo "no coverage data (the test step did not finish)"; exit 0; }
          safety="mlaser/machine/safety.py,mlaser/machine/preflight.py,mlaser/controller/supervisor.py,mlaser/controller/interlocks.py,mlaser/controller/cardlock.py,mlaser/controller/stream.py,mlaser/controller/parts/gate.py,mlaser/controller/parts/jobs.py"
          {
            echo "## Coverage (branch), safety-critical modules"
            echo
            uv run --locked --no-sync coverage report --format=markdown --include="$safety"
            echo
            total=$(uv run --locked --no-sync coverage report --format=total)
            echo "Whole package: $total % (statements and branches). Full report: the \`coverage\` artifact (htmlcov/index.html)."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --locked --no-sync coverage html -q
          uv run --locked --no-sync coverage xml -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.RUN_TESTS == 'true' && (matrix.coverage && !cancelled())
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      # the project's own plugins (plugins/<name>/, published by package.yml): each one installed
      # editable without dependencies (the app environment provides them, as the plugin manager
      # requires), then its own tests; plugins/conftest.py makes tests/ importable and isolates
      # the mlaser directories
      - name: Plugin tests (plugins/*/tests)
        if: env.RUN_TESTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in plugins/*/; do
            [ -f "$d/pyproject.toml" ] || continue
            echo "::group::$d"
            uv pip install --no-deps -e "$d"
            if [ -d "$d/tests" ]; then uv run --locked --no-sync pytest -q -p no:cacheprovider "$d/tests"; fi
            echo "::endgroup::"
          done

      # every platform: the Python stacks a native crash left, one file per xdist worker
      # (tests/conftest.py, MLASER_FAULT_LOG), also when the job was cancelled at its time limit
      # (Ubuntu / Python 3.14, 2026-11-12: a worker went down at 31 %, the run then stood at 98 %
      # until the cancellation, and nothing said which test or where)
      - name: Fault logs
        if: env.RUN_TESTS == 'true' && (failure() || cancelled())
        shell: bash
        run: |
          uv run --locked --no-sync python - <<'PY' || true
          import glob, os
          for f in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "fault.log*"))):
              text = open(f, errors="replace").read()
              print(f"== fault log {f}: {len(text)} bytes")
              if text.strip():
                  print(text)
          PY

      - name: Crash diagnostics (macOS)
        if: env.RUN_TESTS == 'true' && (failure() && runner.os == 'macOS')
        run: |
          echo "== coverage trace (last commands)"; tail -5 "$RUNNER_TEMP/coverage.log" || true
          ls -lt ~/Library/Logs/DiagnosticReports/ | head -5 || true
          f=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "== $f"; uv run --locked python - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          rep = json.loads(raw[1])
          print(rep.get("exception"), rep.get("termination", {}).get("indicator"))
          imgs = rep["usedImages"]
          ft = rep.get("faultingThread", 0)
          for i, th in enumerate(rep["threads"]):
              if i != ft and i != 0:
                  continue
              print(f"thread {i} {th.get('name', '')} {th.get('queue', '')}" + (" (faulting)" if i == ft else ""))
              for fr in th["frames"][:40]:
                  im = imgs[fr["imageIndex"]]
                  print(f"  {im.get('name', '?')}  {fr.get('symbol', '?')}+{fr.get('symbolLocation', 0)}")
          PY
          fi

      # C kernel vs Python port on THIS platform, every golden job + the 300 random jobs, bit for
      # bit (float.hex for the carry and the cut length): catches a platform-specific C build
      # (compiler, flags, libm) independently of the frozen golden files. Fatal everywhere.
      - name: Native parity (C kernel = Python port, all golden jobs)
        if: env.RUN_TESTS == 'true'
        run: uv run --locked python tools/native_parity.py

      # The goldens are bit-exact on CPython 3.12 (tests/golden/test_goldens.py skips on other
      # minor versions), checked with the C kernel forced on and forced off. On Windows and
      # macOS the C library's sin / cos / tan / acos / atan2 / pow differ from glibc by 1-2 ulp
      # and a few records with them (measured and proven libm-only: docs/dev/TESTING.md,
      # "Goldens on Windows and macOS"), so a difference there is reported, not fatal.
      - name: Golden check (C kernel, MLASER_NATIVE=1)
        if: env.RUN_TESTS == 'true' && (matrix.python == '3.12')
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "1"
        run: uv run --locked pytest -q -m golden

      - name: Golden check (Python port, MLASER_NATIVE=0)
        if: env.RUN_TESTS == 'true' && (matrix.python == '3.12')
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "0"
        run: uv run --locked pytest -q -m golden

      # Where do this platform's golden differences come from?  Every libm / LAPACK result the
      # golden computations use, and this platform's golden records, for
      # `tools/golden_libm.py replay` on the reference platform (docs/dev/TESTING.md)
      # (manual runs only: about 1.5 min and a 40-70 MB artifact per job)
      - name: Golden libm recording (Windows, macOS)
        if: env.RUN_TESTS == 'true' && (github.event_name == 'workflow_dispatch' && matrix.python == '3.12' && runner.os != 'Linux' && !cancelled())
        continue-on-error: true
        run: uv run --locked python tools/golden_libm.py record --out golden-libm-${{ runner.os }}.json.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.RUN_TESTS == 'true' && (github.event_name == 'workflow_dispatch' && matrix.python == '3.12' && runner.os != 'Linux' && !cancelled())
        continue-on-error: true
        with:
          name: golden-libm-${{ runner.os }}
          path: golden-libm-${{ runner.os }}.json.gz
          retention-days: 7

      # 3.13 keeps 3.12's compensated sum() and matched bit for bit locally (2026-10-18); the
      # reference stays 3.12, so a difference here (3.13, 3.14) is reported, not fatal.
      - name: Golden check (informative, ${{ matrix.python }}, both kernels)
        if: env.RUN_TESTS == 'true' && (matrix.python != '3.12' && runner.os == 'Linux')
        continue-on-error: true
        env:
          MLASER_GOLDEN_ANY_PYTHON: "1"
        run: |
          MLASER_NATIVE=1 uv run --locked pytest -q -m golden
          MLASER_NATIVE=0 uv run --locked pytest -q -m golden



  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # blocking: the tree is at 0 findings (rule set and per-file ignores in pyproject.toml);
      # uvx runs the pinned ruff without the project environment
      - name: ruff
        run: uvx ruff@0.17.1 check --output-format=github .

  architecture:
    name: import contracts, types, i18n, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py
      - name: Install (locked)
        run: uv sync --locked
      # layering rules of docs/dev/ARCHITECTURE.md ([tool.importlinter] in pyproject.toml)
      - name: import-linter
        run: uv run --locked lint-imports
      # typed core: protocol, geom, parity_ports, nc ([tool.mypy] in pyproject.toml)
      - name: mypy
        run: uv run --locked mypy
      # string catalogues: keys the code uses are in en.json, placeholders match in every
      # translation (.json / Qt Linguist .ts); the import-based scan of the original's keys runs
      # in the test job (tests/test_i18n_check.py)
      - name: i18n check
        run: uv run --locked python tools/i18n_check.py --no-legacy-scan
      # the documents: every relative Markdown link and anchor in docs/ and README.md, docs paths
      # named in code, the user guide's menu paths against the real window, the help browser,
      # and keyboard.md against the command registry.  They also cover a documentation-only
      # change, for which the test matrix skips its steps (job "changed files").
      - name: docs checks
        env:
          MLASER_NO_FIRSTRUN: "1"
        run: |
          uv run --locked pytest -q tests/test_docs_*.py tests/test_help_browser.py
          uv run --locked python tools/gen_keyboard_doc.py --check
      # every ribbon command triggered headlessly (dialogs stubbed, no network): the contract is
      # 0 unimplemented / 0 raising / 0 duplicate registrations (CONTRIBUTING.md); about 30 s
      - name: command coverage
        env:
          MLASER_NO_FIRSTRUN: "1"
        run: uv run --locked python tools/command_coverage.py

  # a red nightly is visible on the run page: one table of every job's result in the summary and
  # an error annotation (nothing is posted anywhere; F3 of the 2026-11-09 review)
  nightly-report:
    name: nightly report
    if: always() && github.event_name == 'schedule'
    needs: [test, lint, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read            # the job list of this run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run_report.sh "Nightly CI" "nightly report"
