name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen       # headless Qt everywhere
      MLASER_PARITY: "0"               # no Wine parity harness in CI (tests/parity also deselected)
      MLASER_NO_FIRSTRUN: "1"
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      # the C emitter kernel (setup.py): a compile error fails the install instead of silently
      # leaving the Python port; and the default profile must select it (docs/dev/NATIVE_KERNEL.md)
      MLASER_BUILD_NATIVE: "1"
      MLASER_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py

      # all extras: the optional modern options (OR-Tools, spyrrow, Ruckig) are tested too.
      # The editable install compiles mlaser._native._emitter (gcc / clang / MSVC, setup.py flags).
      - name: Install (locked, builds the C kernel)
        run: uv sync --locked --all-extras

      # the module imports, has no FMA instruction (objdump / llvm-objdump; skipped on Windows
      # without dumpbin), passes its self-check, is selected by default, smoke parity run
      - name: C kernel check
        run: uv run --locked python tools/build_native.py --check

      - name: "DEBUG (temporary): timer latency on macOS"
        if: runner.os == 'macOS'
        run: |
          cat > "$RUNNER_TEMP/lat.py" <<'PY'
          import ctypes, sys, threading, time, statistics as S
          def probe(tag):
              e = threading.Event()
              for name, fn, want in (("sleep 2ms", lambda: time.sleep(0.002), 0.002),
                                     ("sleep 10ms", lambda: time.sleep(0.01), 0.01),
                                     ("Event.wait 50ms", lambda: e.wait(0.05), 0.05)):
                  d = []
                  for _ in range(30):
                      t = time.perf_counter(); fn(); d.append(time.perf_counter() - t - want)
                  print(f"{tag} {name}: late by median {S.median(d)*1e3:.2f} ms, max {max(d)*1e3:.2f} ms")
          probe("default")
          libc = ctypes.CDLL(None)
          for qos, nm in ((0x21, "USER_INTERACTIVE"), (0x19, "USER_INITIATED")):
              def run(q=qos, n=nm):
                  r = libc.pthread_set_qos_class_self_np(q, 0)
                  probe(f"thread qos {n} (rc {r})")
              t = threading.Thread(target=run); t.start(); t.join()
          PY
          uv run --locked python "$RUNNER_TEMP/lat.py"
          sysctl -n hw.ncpu machdep.cpu.brand_string || true

      - name: "Tests (default suite: unit, ui, sim; parity and golden deselected; C kernel default)"
        env:
          MLASER_FAULT_LOG: ${{ runner.temp }}/fault.log
          MLASER_COVERAGE_TRACE: ${{ runner.temp }}/coverage.log
        run: uv run --locked pytest ${{ runner.os == 'macOS' && '-v' || '-q' }} --durations=15

      - name: "DEBUG (temporary): macOS crash report"
        if: failure() && runner.os == 'macOS'
        run: |
          echo "== fault log"; cat "$RUNNER_TEMP/fault.log" || true
          echo "== coverage trace (last commands)"; tail -5 "$RUNNER_TEMP/coverage.log" || true
          uv run --locked python -c "import PySide6, sys; print(PySide6.__file__)"
          ls -lt ~/Library/Logs/DiagnosticReports/ | head -5 || true
          f=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "== $f"; uv run --locked python - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          rep = json.loads(raw[1])
          print(rep.get("exception"), rep.get("termination", {}).get("indicator"))
          imgs = rep["usedImages"]
          ft = rep.get("faultingThread", 0)
          for i, th in enumerate(rep["threads"]):
              if i != ft and i != 0:
                  continue
              print(f"thread {i} {th.get('name', '')} {th.get('queue', '')}" + (" (faulting)" if i == ft else ""))
              for fr in th["frames"][:40]:
                  im = imgs[fr["imageIndex"]]
                  print(f"  {im.get('name', '?')}  {fr.get('symbol', '?')}+{fr.get('symbolLocation', 0)}")
          PY
          fi

      # C kernel vs Python port on THIS platform, every golden job + the 300 random jobs, bit for
      # bit (float.hex for the carry and the cut length): catches a platform-specific C build
      # (compiler, flags, libm) independently of the frozen golden files. Fatal everywhere.
      - name: Native parity (C kernel = Python port, all golden jobs)
        run: uv run --locked python tools/native_parity.py

      # The goldens are bit-exact on CPython 3.12 (tests/golden/test_goldens.py skips on other
      # minor versions), checked with the C kernel forced on and forced off. Windows and macOS
      # libm may differ from Linux in the last bit (in the Python port too); until a first green
      # run proves they don't, a golden difference there is reported, not fatal.
      - name: Golden check (C kernel, MLASER_NATIVE=1)
        if: matrix.python == '3.12'
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "1"
        run: uv run --locked pytest -q -m golden

      - name: Golden check (Python port, MLASER_NATIVE=0)
        if: matrix.python == '3.12'
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "0"
        run: uv run --locked pytest -q -m golden

      # Where do this platform's golden differences come from?  Every libm / LAPACK result the
      # golden computations use, and this platform's golden records, for
      # `tools/golden_libm.py replay` on the reference platform (docs/dev/TESTING.md)
      - name: Golden libm recording (Windows, macOS)
        if: matrix.python == '3.12' && runner.os != 'Linux' && !cancelled()
        continue-on-error: true
        run: >-
          uv run --locked python tools/golden_libm.py record --out golden-libm-${{ runner.os }}.json.gz
          --trace jobs_random/seed019 jobs_random/seed105 jobs_random/seed113 jobs_random/seed256
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12' && runner.os != 'Linux' && !cancelled()
        continue-on-error: true
        with:
          name: golden-libm-${{ runner.os }}
          path: golden-libm-${{ runner.os }}.json.gz
          retention-days: 7

      # 3.13 keeps 3.12's compensated sum() and matched bit for bit locally (2026-10-18); the
      # reference stays 3.12, so a difference here is reported, not fatal.
      - name: Golden check (informative, 3.13, both kernels)
        if: matrix.python == '3.13' && runner.os == 'Linux'
        continue-on-error: true
        env:
          MLASER_GOLDEN_ANY_PYTHON: "1"
        run: |
          MLASER_NATIVE=1 uv run --locked pytest -q -m golden
          MLASER_NATIVE=0 uv run --locked pytest -q -m golden

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # informative until the existing findings are cleaned up (pre-commit lints changed files)
      - name: ruff
        continue-on-error: true
        run: uvx ruff@0.17.1 check --output-format=github .

  architecture:
    name: import contracts, types, i18n, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py
      - name: Install (locked)
        run: uv sync --locked
      # layering rules of docs/dev/ARCHITECTURE.md ([tool.importlinter] in pyproject.toml)
      - name: import-linter
        run: uv run --locked lint-imports
      # typed core: protocol, geom, parity_ports, nc ([tool.mypy] in pyproject.toml)
      - name: mypy
        run: uv run --locked mypy
      # string catalogues: keys the code uses are in en.json, placeholders match in every
      # translation (.json / Qt Linguist .ts); the import-based scan of the original's keys runs
      # in the test job (tests/test_i18n_check.py)
      - name: i18n check
        run: uv run --locked python tools/i18n_check.py --no-legacy-scan
      # every relative Markdown link and anchor in docs/ and README.md, docs paths named in code
      - name: docs link check
        run: uv run --locked pytest -q tests/test_docs_links.py
