name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen       # headless Qt everywhere
      MLASER_PARITY: "0"               # no Wine parity harness in CI (tests/parity also deselected)
      MLASER_NO_FIRSTRUN: "1"
      PYTHONUTF8: "1"
      # the C emitter kernel (setup.py): a compile error fails the install instead of silently
      # leaving the Python port; and the default profile must select it (docs/dev/NATIVE_KERNEL.md)
      MLASER_BUILD_NATIVE: "1"
      MLASER_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py

      # all extras: the optional modern options (OR-Tools, spyrrow, Ruckig) are tested too.
      # The editable install compiles mlaser._native._emitter (gcc / clang / MSVC, setup.py flags).
      - name: Install (locked, builds the C kernel)
        run: uv sync --locked --all-extras

      # the module imports, has no FMA instruction (objdump / llvm-objdump; skipped on Windows
      # without dumpbin), passes its self-check, is selected by default, smoke parity run
      - name: C kernel check
        run: uv run --locked python tools/build_native.py --check

      - name: "DEBUG (temporary): macOS kernel build command and FMA sites"
        if: failure() && runner.os == 'macOS'
        run: |
          set -x
          uv run --locked python -c "import sys; print(sys.executable, sys.version)"
          PYINC=$(uv run --locked python -c "import sysconfig;print(sysconfig.get_paths()['include'])")
          SRC=mlaser/_native/_emitter.c
          BASE="-fno-strict-overflow -Wsign-compare -Wunreachable-code -fno-common -dynamic -DNDEBUG -g -O3 -Wall"
          clang -### $BASE -arch arm64 -I"$PYINC" -c $SRC -o /tmp/x.o -O2 -ffp-contract=off -fno-fast-math 2>&1 | tr ' ' '\n' | grep -iE 'contract|fast|math|fp-|^"-O' || true
          try() { clang $BASE -I"$PYINC" -c $SRC -o /tmp/x.o "$@" 2>/dev/null && echo "fmadd=$(objdump -d /tmp/x.o | grep -c fmadd) :: $*"; }
          try -arch arm64 -arch x86_64 -O2 -ffp-contract=off -fno-fast-math
          try -arch arm64 -O2 -ffp-contract=off -fno-fast-math
          try -arch arm64 -O2 -fno-fast-math -ffp-contract=off
          try -arch arm64 -O2 -ffp-contract=off
          try -arch arm64 -O2
          try -arch arm64 -O0
          try -arch arm64 -O2 -ffp-contract=off -fno-fast-math -ffp-model=strict
          try -arch arm64 -O2 -ffp-contract=off -fno-fast-math -Xclang -ffp-contract=off
          try -arch arm64 -O2 -ffp-contract=off -fno-fast-math -fno-slp-vectorize -fno-vectorize
          clang $BASE -arch arm64 -I"$PYINC" -S $SRC -o /tmp/x.s -O2 -ffp-contract=off -fno-fast-math
          grep -nE 'fmadd|\.loc[[:space:]]+[0-9]+[[:space:]]+[0-9]+' /tmp/x.s | grep -B3 fmadd | head -40
          clang $BASE -arch arm64 -I"$PYINC" -S -emit-llvm $SRC -o /tmp/x.ll -O2 -ffp-contract=off -fno-fast-math
          grep -nE 'fmuladd|llvm.fma|contract' /tmp/x.ll | head -20
          clang $BASE -arch arm64 -I"$PYINC" -S -emit-llvm $SRC -o /tmp/x0.ll -O0 -Xclang -disable-O0-optnone -ffp-contract=off -fno-fast-math
          grep -nE 'fmuladd|llvm.fma|contract' /tmp/x0.ll | head -20

      - name: "Tests (default suite: unit, ui, sim; parity and golden deselected; C kernel default)"
        run: uv run --locked pytest -q --durations=15

      # C kernel vs Python port on THIS platform, every golden job + the 300 random jobs, bit for
      # bit (float.hex for the carry and the cut length): catches a platform-specific C build
      # (compiler, flags, libm) independently of the frozen golden files. Fatal everywhere.
      - name: Native parity (C kernel = Python port, all golden jobs)
        run: uv run --locked python tools/native_parity.py

      # The goldens are bit-exact on CPython 3.12 (tests/golden/test_goldens.py skips on other
      # minor versions), checked with the C kernel forced on and forced off. Windows and macOS
      # libm may differ from Linux in the last bit (in the Python port too); until a first green
      # run proves they don't, a golden difference there is reported, not fatal.
      - name: Golden check (C kernel, MLASER_NATIVE=1)
        if: matrix.python == '3.12'
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "1"
        run: uv run --locked pytest -q -m golden

      - name: Golden check (Python port, MLASER_NATIVE=0)
        if: matrix.python == '3.12'
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          MLASER_NATIVE: "0"
        run: uv run --locked pytest -q -m golden

      # 3.13 keeps 3.12's compensated sum() and matched bit for bit locally (2026-10-18); the
      # reference stays 3.12, so a difference here is reported, not fatal.
      - name: Golden check (informative, 3.13, both kernels)
        if: matrix.python == '3.13' && runner.os == 'Linux'
        continue-on-error: true
        env:
          MLASER_GOLDEN_ANY_PYTHON: "1"
        run: |
          MLASER_NATIVE=1 uv run --locked pytest -q -m golden
          MLASER_NATIVE=0 uv run --locked pytest -q -m golden

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # informative until the existing findings are cleaned up (pre-commit lints changed files)
      - name: ruff
        continue-on-error: true
        run: uvx ruff@0.17.1 check --output-format=github .

  architecture:
    name: import contracts, types, i18n, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            setup.py
      - name: Install (locked)
        run: uv sync --locked
      # layering rules of docs/dev/ARCHITECTURE.md ([tool.importlinter] in pyproject.toml)
      - name: import-linter
        run: uv run --locked lint-imports
      # typed core: protocol, geom, parity_ports, nc ([tool.mypy] in pyproject.toml)
      - name: mypy
        run: uv run --locked mypy
      # string catalogues: keys the code uses are in en.json, placeholders match in every
      # translation (.json / Qt Linguist .ts); the import-based scan of the original's keys runs
      # in the test job (tests/test_i18n_check.py)
      - name: i18n check
        run: uv run --locked python tools/i18n_check.py --no-legacy-scan
      # every relative Markdown link and anchor in docs/ and README.md, docs paths named in code
      - name: docs link check
        run: uv run --locked pytest -q tests/test_docs_links.py
