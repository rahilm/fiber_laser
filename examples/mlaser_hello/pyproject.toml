[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlaser-hello"
version = "0.1.0"
description = "Example mlaser plugin: a command that adds a grid of squares (docs/dev/PLUGINS.md)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mlaser"]

# mlaser finds plugins through this entry-point group (services.plugins.discover)
[project.entry-points."mlaser.plugins"]
hello = "mlaser_hello:plugin"
